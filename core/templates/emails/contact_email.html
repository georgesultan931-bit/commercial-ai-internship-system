<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #1a1a3e, #2d2d6b); color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { background: #f8fafc; padding: 30px; border-radius: 0 0 8px 8px; }
        .footer { text-align: center; margin-top: 20px; color: #6b7280; font-size: 14px; }
        .message-box { background: #e5e7eb; padding: 15px; border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>New Contact Form Message</h1>
        </div>
        <div class="content">
            <p><strong>Name:</strong> {{ name }}</p>
            <p><strong>Email:</strong> <a href="mailto:{{ email }}">{{ email }}</a></p>
            <p><strong>Subject:</strong> {{ subject }}</p>
            <div class="message-box">
                <p><strong>Message:</strong></p>
                <p>{{ message }}</p>
            </div>
            <p style="margin-top: 20px;">Please respond to this inquiry as soon as possible.</p>
            <p>Best regards,<br><strong>AI Internship System</strong></p>
        </div>
        <div class="footer">
        </div>
    </div>
</body>
</html>
