{% extends 'homepage/dashboard_base.html' %}

{% block page_title %}Settings{% endblock %}

{% block content %}
<div style="padding: 20px; max-width: 700px; margin: 0 auto;">
    <div style="background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 30px;">
        <h1 style="font-size: 24px; color: #0b1a33; margin-bottom: 5px;"> Settings</h1>
        <p style="color: #888; margin-bottom: 25px;">Update your supervisor profile information</p>

        {% if messages %}
            {% for message in messages %}
                <div style="padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; background: {% if message.tags == 'success' %}#ecfdf3{% else %}#fef2f2{% endif %}; color: {% if message.tags == 'success' %}#0b9f6c{% else %}#dc2626{% endif %}; border: 1px solid {% if message.tags == 'success' %}#a7f3d0{% else %}#fecaca{% endif %};">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #1f2a44; margin-bottom: 6px;">Phone</label>
                <input type="text" name="phone" value="{{ supervisor.phone|default:'' }}" style="width: 100%; padding: 12px; background: #f7f9fc; border: 1.5px solid #e2e8f0; border-radius: 12px; outline: none; transition: 0.2s;" placeholder="Enter your phone number">
            </div>

            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #1f2a44; margin-bottom: 6px;">Office Location</label>
                <input type="text" name="office_location" value="{{ supervisor.office_location|default:'' }}" style="width: 100%; padding: 12px; background: #f7f9fc; border: 1.5px solid #e2e8f0; border-radius: 12px; outline: none; transition: 0.2s;" placeholder="e.g., Nairobi, Kenya">
            </div>

            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #1f2a44; margin-bottom: 6px;">Office Hours</label>
                <input type="text" name="office_hours" value="{{ supervisor.office_hours|default:'' }}" style="width: 100%; padding: 12px; background: #f7f9fc; border: 1.5px solid #e2e8f0; border-radius: 12px; outline: none; transition: 0.2s;" placeholder="e.g., Mon-Fri 9am-5pm">
            </div>

            <div style="margin-top: 25px; display: flex; gap: 12px; flex-wrap: wrap;">
                <button type="submit" style="background: #4f46e5; color: white; padding: 12px 40px; border: none; border-radius: 40px; cursor: pointer; font-weight: 600;">
                    <i class="fas fa-save"></i> Save Settings
                </button>
                <a href="{% url 'supervisor:profile' %}" style="background: #f1f4f9; color: #1f2a44; padding: 12px 40px; border-radius: 40px; text-decoration: none; font-weight: 600;">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
