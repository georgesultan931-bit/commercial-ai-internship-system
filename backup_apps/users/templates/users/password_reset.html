{% extends 'homepage/base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<section style="padding: 4rem 2rem; max-width: 500px; margin: 0 auto;">
    <div style="background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <h1 style="font-size: 2rem; margin-bottom: 0.5rem; text-align: center;">Reset Password</h1>
        <p style="text-align: center; color: #6b7280; margin-bottom: 2rem;">
            Enter your email address and we'll send you a link to reset your password.
        </p>
        
        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; color: #374151;">Email Address</label>
                <input type="email" name="email" required 
                       style="width: 100%; padding: 0.8rem; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 1rem;"
                       placeholder="your@email.com">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                <i class="fas fa-envelope"></i> Send Reset Link
            </button>
        </form>
        
        <p style="margin-top: 1.5rem; text-align: center; color: #6b7280;">
            Remember your password? 
            <a href="{% url 'account_login' %}" style="color: #2563eb; text-decoration: none; font-weight: 600;">
                Back to Login
            </a>
        </p>
    </div>
</section>
{% endblock %}
