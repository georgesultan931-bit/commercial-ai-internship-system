{% extends 'homepage/base.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<section style="padding: 4rem 2rem; max-width: 500px; margin: 0 auto;">
    <div style="background: white; padding: 2.5rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center;">
        <div style="font-size: 4rem; margin-bottom: 1rem;">✅</div>
        <h1 style="font-size: 2rem; margin-bottom: 1rem;">Password Reset Complete</h1>
        <p style="color: #6b7280; margin-bottom: 1.5rem;">
            Your password has been successfully reset.
            You can now login with your new password.
        </p>
        <a href="{% url 'account_login' %}" class="btn btn-primary" style="display: inline-block;">
            <i class="fas fa-sign-in-alt"></i> Login Now
        </a>
    </div>
</section>
{% endblock %}
