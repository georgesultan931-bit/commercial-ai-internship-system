{% extends 'homepage/dashboard_base.html' %}

{% block page_title %}Settings{% endblock %}

{% block content %}
<div style="padding: 20px; max-width: 700px; margin: 0 auto;">
    <div style="background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 30px;">
        <h1 style="font-size: 24px; color: #0b1a33; margin-bottom: 5px;">⚙️ Settings</h1>
        <p style="color: #888; margin-bottom: 25px;">Update your institution settings</p>

        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #1f2a44; margin-bottom: 6px;">Institution Name</label>
                <input type="text" name="institution_name" value="{{ profile.institution_name|default:'' }}" style="width: 100%; padding: 12px; background: #f7f9fc; border: 1.5px solid #e2e8f0; border-radius: 12px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #1f2a44; margin-bottom: 6px;">Phone</label>
                <input type="text" name="phone" value="{{ profile.phone|default:'' }}" style="width: 100%; padding: 12px; background: #f7f9fc; border: 1.5px solid #e2e8f0; border-radius: 12px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 13px; font-weight: 600; color: #1f2a44; margin-bottom: 6px;">Location</label>
                <input type="text" name="location" value="{{ profile.location|default:'' }}" style="width: 100%; padding: 12px; background: #f7f9fc; border: 1.5px solid #e2e8f0; border-radius: 12px;">
            </div>

            <button type="submit" style="background: #4f46e5; color: white; padding: 12px 40px; border: none; border-radius: 40px; cursor: pointer; font-weight: 600;">
                <i class="fas fa-save"></i> Save Settings
            </button>
        </form>
    </div>
</div>
{% endblock %}
