<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Out — Internship Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #ffffff;
            max-width: 440px;
            width: 100%;
            padding: 48px 40px;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 20, 50, 0.08);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: #eef2ff;
            color: #4f46e5;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            padding: 4px 14px;
            border-radius: 100px;
            margin-bottom: 16px;
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            background: #fef2f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .icon-wrapper svg {
            width: 36px;
            height: 36px;
            stroke: #dc2626;
            stroke-width: 1.8;
            fill: none;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0b1a33;
            letter-spacing: -0.4px;
            margin-bottom: 8px;
        }

        .subhead {
            color: #5b6a87;
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .session-info {
            background: #f7f9fc;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #eef2f6;
        }

        .session-info .label {
            font-size: 13px;
            font-weight: 500;
            color: #5b6a87;
        }

        .session-info .value {
            font-size: 14px;
            font-weight: 600;
            color: #0b1a33;
        }

        .divider {
            border: none;
            border-top: 1.5px solid #eef2f6;
            margin: 0 0 24px 0;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-secondary {
            flex: 1;
            padding: 16px;
            background: #f1f4f9;
            color: #1f2a44;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            text-align: center;
        }

        .btn-secondary:hover {
            background: #e5e9f0;
        }

        .btn-danger {
            flex: 1;
            padding: 16px;
            background: #dc2626;
            color: white;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            text-align: center;
        }

        .btn-danger:hover {
            background: #b91c1c;
            transform: scale(1.01);
            box-shadow: 0 12px 28px rgba(220, 38, 38, 0.2);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            font-size: 14px;
            color: #5b6a87;
            text-decoration: none;
            font-weight: 500;
            transition: 0.15s;
        }

        .back-link:hover {
            color: #0b1a33;
        }

        .back-link::before {
            content: "←";
            font-size: 18px;
            line-height: 1;
        }

        /* Loading state */
        .btn-danger.loading {
            opacity: 0.7;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-danger.loading::after {
            content: " ...";
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 20px;
            }

            h1 {
                font-size: 22px;
            }

            .actions {
                flex-direction: column;
            }

            .session-info {
                flex-direction: column;
                gap: 4px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="card">

    <!-- Badge -->
    <div class="badge">⚡ Commercial-Grade</div>

    <!-- Icon -->
    <div class="icon-wrapper">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
    </div>

    <!-- Heading -->
    <h1>Sign Out</h1>
    <p class="subhead">Are you sure you want to sign out?<br />You'll need to sign in again to access your account.</p>

    <!-- Session info -->
    <div class="session-info">
        <span class="label">Signed in as</span>
        <span class="value" id="userEmail">alex.morgan@company.com</span>
    </div>

    <hr class="divider" />

    <!-- Actions -->
    <div class="actions">
        <!-- ✅ Cancel - goes back to dashboard -->
        <a href="{% url 'homepage:dashboard' %}" class="btn-secondary">Cancel</a>
        
        <!-- ✅ Sign Out - triggers logout -->
        <form method="post" action="{% url 'account_logout' %}" style="flex: 1; margin: 0; padding: 0;">
            {% csrf_token %}
            <button type="submit" class="btn-danger" id="logoutBtn">Sign Out</button>
        </form>
    </div>

    <!-- Back -->
    <a href="{% url 'homepage:dashboard' %}" class="back-link">Back to Dashboard</a>

</div>

<script>
    // Get the logged-in user's email from the session
    document.addEventListener('DOMContentLoaded', function() {
        // You can pass the email from Django context
        // Option 1: Use Django template variable
        // const userEmail = "{{ user.email|default:user.username }}";
        
        // Option 2: Or use the existing email in the page
        // The email is already in the HTML
    });

    // Optional: Add loading state when signing out
    document.getElementById('logoutBtn')?.addEventListener('click', function(e) {
        this.classList.add('loading');
        this.textContent = 'Signing Out';
        // The form will submit and redirect automatically
    });
</script>

</body>
</html>
